groups:
  - name: retail-radar-p0
    rules:
      - alert: RetailRadarWorkerHeartbeatStale
        expr: retail_orchestrator_stale_active_workers > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "正在执行任务的采集设备超过 2 分钟未更新"
      - alert: RetailRadarMasterUnavailable
        expr: up{job="retail-radar-master"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "调度服务暂时不可用"
      - alert: RetailRadarExpiredTaskLease
        expr: retail_orchestrator_expired_leases > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "存在等待系统恢复的采集任务"
      - alert: RetailRadarTaskNeedsAttention
        expr: retail_orchestrator_attention_tasks > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "存在需要处理的采集任务"
      - alert: RetailRadarNotificationDeadLetter
        expr: retail_orchestrator_notification_dead_letters > 0 or retail_orchestrator_notification_outcome_unknown > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "人工介入通知存在未确认结果"
      - alert: RetailRadarInvalidRawArtifact
        expr: retail_orchestrator_invalid_artifacts > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "原始数据产物缺少校验和或对象版本"
      - alert: RetailRadarUnfrozenScope
        expr: retail_orchestrator_active_runs_without_scope > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "活动采集批次未冻结目标类目范围"
      - alert: RetailRadarRiskWaitingTooLong
        expr: retail_orchestrator_oldest_open_risk_seconds > 900
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "人工处理事项等待超过 15 分钟"

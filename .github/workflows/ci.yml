name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: 测试与公开安全检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 交接专项测试
        run: pnpm handoff:test

      - name: 类型检查
        run: pnpm typecheck

      - name: 工作区测试
        run: pnpm test

      - name: 生产构建
        run: pnpm build:production

      - name: 公开仓库脱敏校验
        run: pnpm public:verify
